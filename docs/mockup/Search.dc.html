<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shuffle Notes — Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F8F8FF}a:hover{color:#FFFFFF}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:16px;height:16px}
.ico.xs{width:14px;height:14px}
button{font-family:Manrope,sans-serif;cursor:pointer}
input{font-family:Manrope,sans-serif}
.band{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;color:#F8F8FF}
.island{height:40px;border-radius:20px;background:#141414;border:1px solid #333;display:flex;align-items:center;gap:10px;padding:0 16px 0 5px;font-size:13px;box-sizing:border-box}
.dock{display:flex;gap:6px;align-items:center;background:#141414;border:1px solid #333;border-radius:16px;padding:5px}
.dk{width:44px;height:44px;border-radius:12px;background:#242424;display:flex;align-items:center;justify-content:center;border:0;color:#F8F8FF;position:relative;padding:0}
.status{display:flex;align-items:center;gap:14px;height:40px;padding:0 6px 0 14px;border-radius:20px;background:#141414;border:1px solid #333;font-size:13px;box-sizing:border-box}
.tab{height:40px;padding:0 16px;border-radius:20px;border:0;background:transparent;color:#F8F8FF;font-size:14px;font-weight:600}
.res{display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:12px;min-height:64px;box-sizing:border-box;width:100%;border:0;background:transparent;color:#F8F8FF;text-align:left}
.sw{width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#1A1A1A}
.dchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;background:#242424;font-size:11px;font-weight:700;color:#C8C8CE}
mark{background:rgba(242,217,138,0.28);color:#F8F8FF;border-radius:3px;padding:0 2px}
.gh{font-size:12px;font-weight:800;color:#8A8A90;letter-spacing:0.06em;padding:6px 12px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #F8F8FF; background: #1F2F38">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #4A6676 0%, #34505F 48%, #233741 80%, #3B302A 100%)"></div>
  <div style="position: absolute; left: 10px; top: 10px; right: 10px; bottom: 74px; background: #141414; border-radius: 8px"></div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <div style="position: absolute; left: 250px; top: 56px; width: 780px; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; align-items: center; gap: 14px; height: 64px; border-radius: 32px; background: #1C1C1C; border: 1px solid #F8F8FF; padding: 0 22px; box-sizing: border-box">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input value="flick" aria-label="Search" style="flex: 1; background: transparent; border: 0; outline: none; color: #F8F8FF; font-size: 22px; font-weight: 600">
    </label>
    <div role="tablist" style="display: flex; gap: 4px">
      <button class="tab" role="tab">All</button>
      <button class="tab" role="tab">Apps</button>
      <button class="tab" role="tab">Files</button>
      <button class="tab" role="tab" aria-selected="true" style="background: #F8F8FF; color: #141414; display: inline-flex; align-items: center; gap: 8px"><svg class="ico s" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg>Notes · 4</button>
      <button class="tab" role="tab">Lately</button>
    </div>

    <div style="background: #141414; border: 1px solid #333; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
      <div class="gh">ON CARDS</div>
      <button class="res" style="background: rgba(248,248,255,0.12)">
        <span class="sw" style="background: #F2D98A"><svg class="ico s" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg></span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 16px; font-weight: 600"><mark>Flick</mark> threshold feels short on the Z13. Measure the real velocity…</span>
          <span style="display: flex; gap: 6px; margin-top: 6px"><span class="dchip">Card · SpreadGesture.qml</span><span class="dchip">Shuffle</span></span>
        </span>
        <span style="font-size: 12px; color: #AFAFAF">12 min</span>
      </button>
      <button class="res">
        <span class="sw" style="background: #9ED6CB"><svg class="ico s" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg></span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 16px; font-weight: 600">Reporter says a slow <mark>flick</mark> opens Spread halfway, then stops</span>
          <span style="display: flex; gap: 6px; margin-top: 6px"><span class="dchip">Card · Bug 412 · GitHub</span></span>
        </span>
        <span style="font-size: 12px; color: #AFAFAF">Yesterday</span>
      </button>
      <div class="gh">HANDWRITTEN</div>
      <button class="res">
        <span class="sw" style="background: #E8B4A8"><svg class="ico s" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px">
          <svg viewBox="0 0 200 40" style="width: 170px; height: 34px; flex: none" fill="none" stroke="#F8F8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20c4-10 8-14 10-8s-4 14 2 14 6-12 10-12-2 12 4 12"/><path d="M42 14c-4 0-6 14 2 14s6-8 2-14M54 8c-2 8 0 16 0 20M54 18c4-4 10-3 10 3s0 7 2 7"/><path d="M84 16c3 5 4 10 7 10s4-12 7-12 3 12 6 12"/><path d="M122 8c-3 8-3 14 0 20M116 18h12M140 18c2 4 0 10 2 10"/></svg>
          <span style="display: block; min-width: 0">
            <span style="display: block; font-size: 14px; color: #C8C8CE">Read as “measure <mark>flick</mark> velocity”</span>
            <span style="display: flex; gap: 6px; margin-top: 6px"><span class="dchip">Today 4:00 PM</span><span class="dchip">Shuffle</span></span>
          </span>
        </span>
        <span style="font-size: 12px; color: #AFAFAF">1 hr</span>
      </button>
      <div class="gh">LOOSE</div>
      <button class="res">
        <span class="sw" style="background: #D9D4CC"><svg class="ico s" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg></span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 16px; font-weight: 600">A <mark>flick</mark> down on a sticky could tuck it away, like closing a card</span>
          <span style="display: flex; gap: 6px; margin-top: 6px"><span class="dchip">Loose</span></span>
        </span>
        <span style="font-size: 12px; color: #AFAFAF">Thu</span>
      </button>
    </div>

    <button style="height: 56px; border-radius: 16px; background: #1C1C1C; border: 1px solid #333; color: #F8F8FF; display: flex; align-items: center; gap: 12px; padding: 0 18px; font-size: 15px; font-weight: 600; text-align: left">
      <svg class="ico s" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
      <span style="flex: 1">Ask Genie to gather these four into one plan</span>
      <svg class="ico s" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
  </div>

  <div class="band">
    <div class="island">
      <span style="width: 30px; height: 30px; border-radius: 15px; background: #242424; display: flex; align-items: center; justify-content: center"><svg class="ico xs" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      <span>Low Tide · Shoreline</span>
    </div>
    <div class="dock">
      <button class="dk" aria-label="Search" style="background: #F8F8FF"><span style="width: 14px; height: 14px; border-radius: 7px; background: #141414"></span></button>
      <button class="dk" aria-label="Files"><svg class="ico" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></button>
      <button class="dk" aria-label="Firefox"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></button>
      <button class="dk" aria-label="Kate"><svg class="ico" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></button>
      <button class="dk" aria-label="Terminal"><svg class="ico" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></svg></button>
      <button class="dk" aria-label="Notes" style="background: #F2D98A; color: #1A1A1A"><svg class="ico" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg></button>
    </div>
    <div class="status">
      <svg class="ico s" viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
      <svg class="ico s" viewBox="0 0 24 24"><rect width="16" height="10" x="2" y="7" rx="2"/><path d="M22 11v2"/><path d="M6 11v2"/><path d="M10 11v2"/></svg>
      <span style="font-weight: 600">2:55 PM</span>
      <button class="dk" aria-label="Notifications" style="width: 30px; height: 30px; border-radius: 15px"><svg class="ico xs" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
