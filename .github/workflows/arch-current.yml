name: Arch current

# Builds and checks Gooseberry against Arch Linux's current KDE and Qt
# packages, so a KDE update that breaks the build shows here before it reaches
# a device.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Arch current
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake extra-cmake-modules git python dbus \
            qt6-base qt6-declarative \
            kcoreaddons kdbusaddons ki18n kservice kwindowsystem kirigami \
            layer-shell-qt plasma-workspace

      - uses: actions/checkout@v5

      - name: Record the KDE and Qt versions checked
        run: pacman -Q qt6-base qt6-declarative extra-cmake-modules kirigami layer-shell-qt plasma-workspace

      - name: Run ./verify.sh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dbus-run-session -- ./verify.sh
