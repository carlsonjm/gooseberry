# Gooseberry as a Flatpak, built from this checkout. The copy sent to Flathub
# takes the same modules with the source pinned to a release commit.
id: co.goodinput.Notes
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: gooseberry
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The notes themselves, kept where an install outside Flatpak keeps them.
  - --filesystem=xdg-documents/Gooseberry:create
  # A removed note goes to the person's own trash, never deleted outright.
  - --filesystem=xdg-data/Trash:create
  # One running copy, and the quick note a desktop search can call.
  - --own-name=io.github.carlsonjm.gooseberry
  # Reminders as the desktop's notifications.
  - --talk-name=org.freedesktop.Notifications
  # Typing still waiting for a pause is written before the computer sleeps.
  - --system-talk-name=org.freedesktop.login1
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/qlogging-categories6
modules:
  # The capture card floats over the work as a layer of its own; the KDE
  # runtime does not carry this library.
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/plasma/layer-shell-qt.git
        tag: v6.5.5
        commit: 76fbe5deb9d9545be98d1900b5d0df868616759e

  - name: gooseberry
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DGOOSEBERRY_APP_ID=co.goodinput.Notes
      - -DGOOSEBERRY_WINDOW_LIST=OFF
      - -DGOOSEBERRY_METAINFO=ON
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - .flatpak-builder
