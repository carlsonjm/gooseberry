<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Notes: a page with its lines lit, drawn as the dock's pearls are (Ghost White pieces on their 24 unit grid, one pearl gradient) on the Shuffle app tile, a step above Piano so an app never reads as a pearl on the dark band. The tile sits inside the margin icon themes leave around app artwork (42 of 48 in Colloid), so it is drawn the size of the apps beside it. -->
<defs><linearGradient id="pearl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F4F4FA"/><stop offset="1" stop-color="#DCDCE4"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2E30"/><stop offset="1" stop-color="#202022"/></linearGradient>
</defs>
<rect x="16" y="16" width="224" height="224" rx="35" fill="url(#tile)"/>
<rect x="76" y="63" width="104" height="130" rx="22.75" fill="#F8F8FF" fill-opacity="0.5"/>
<rect x="95.5" y="95.5" width="65" height="19.5" rx="9.75" fill="url(#pearl)"/>
<rect x="95.5" y="128" width="65" height="19.5" rx="9.75" fill="url(#pearl)"/>
<rect x="95.5" y="160.5" width="39" height="19.5" rx="9.75" fill="url(#pearl)"/>
</svg>
